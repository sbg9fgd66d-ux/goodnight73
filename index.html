<section id="player" class="screen">

<script>
/* ============================================================
   录音库 —— 把你的录音放进 audio/ 文件夹，然后改这里就好。
   每段： { title:"名字", src:"audio/文件名.m4a" }
   碎片 = pian ，童话 = hua 。想加几段就加几行。
   ============================================================ */
const LIBRARY = {
  pian: {
    name: "碎片",
    tracks: [
      { title: "intro", src: "audio/intro.mp3" },
    ]
  },
  hua: {
    name: "Contes de fées",
    tracks: [
      { title: "XXI", src: "audio/XXI.mp3" },
      { title: "XXII", src: "audio/XXII.mp3" },
      { title: "XXIV", src: "audio/XXIV.mp3" },
    ]
  }
};

/* ---------------- 萤火虫光点（漂浮 · 呼吸） ---------------- */
const bg = document.getElementById('bgstars'), bx = bg.getContext('2d');
function sizeCanvas(c){ c.width = innerWidth*devicePixelRatio; c.height = innerHeight*devicePixelRatio; }
// 预制柔光精灵（一次生成，反复贴图，省性能）
function makeGlow(color){
  const s=64, cv=document.createElement('canvas'); cv.width=cv.height=s;
  const g=cv.getContext('2d'), grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  grd.addColorStop(0,color+'1)'); grd.addColorStop(.25,color+'.5)'); grd.addColorStop(1,color+'0)');
  g.fillStyle=grd; g.fillRect(0,0,s,s); return cv;
}
const GLOWS=[ makeGlow('rgba(255,205,120,'), makeGlow('rgba(255,224,150,'),
              makeGlow('rgba(255,190,92,'),  makeGlow('rgba(210,222,255,') ];
let flies=[];
function initBg(){
  sizeCanvas(bg); flies=[];
  const n=Math.min(54, Math.floor(innerWidth*innerHeight/26000));
  for(let i=0;i<n;i++){
    flies.push({
      x:Math.random()*bg.width, y:Math.random()*bg.height,
      ang:Math.random()*6.28, spd:(Math.random()*0.11+0.025)*devicePixelRatio,
      wander:Math.random()*0.018+0.004,
      size:(Math.random()*6+3)*devicePixelRatio, core:(Math.random()*1.1+0.5)*devicePixelRatio,
      phase:Math.random()*6.28, bspeed:Math.random()*0.8+0.28,
      amp:Math.random()*0.42+0.42, base:Math.random()*0.10+0.03,
      glow:GLOWS[(Math.random()<0.82?(Math.random()*3|0):3)], t:Math.random()*100
    });
  }
}
function drawBg(){
  bx.clearRect(0,0,bg.width,bg.height);
  bx.globalCompositeOperation='lighter';
  const m=30*devicePixelRatio;
  for(const f of flies){
    f.t+=0.016;
    f.ang+=(Math.sin(f.t*f.wander*8)+Math.cos(f.t*f.wander*5))*f.wander;
    f.x+=Math.cos(f.ang)*f.spd; f.y+=Math.sin(f.ang)*f.spd;
    if(f.x<-m)f.x=bg.width+m; else if(f.x>bg.width+m)f.x=-m;
    if(f.y<-m)f.y=bg.height+m; else if(f.y>bg.height+m)f.y=-m;
    let a=f.base+f.amp*(0.5+0.5*Math.sin(f.t*f.bspeed+f.phase));
    a=Math.max(0,Math.min(1,a));
    const sz=f.size*(0.7+0.3*a);
    bx.globalAlpha=a; bx.drawImage(f.glow, f.x-sz, f.y-sz, sz*2, sz*2);
    bx.globalAlpha=Math.min(1,a*1.25); bx.fillStyle='#fff';
    bx.beginPath(); bx.arc(f.x,f.y,f.core*(0.6+a*0.6),0,7); bx.fill();
  }
  bx.globalAlpha=1; bx.globalCompositeOperation='source-over';
  requestAnimationFrame(drawBg);
}

/* ---------------- 落星（鼠标/点触） ---------------- */
const fc = document.getElementById('falling'), fx = fc.getContext('2d');
let parts = [];
function initFall(){ sizeCanvas(fc); }
function spawn(x,y,burst){
  const dpr=devicePixelRatio, count = burst ? 8 : 1;
  for(let i=0;i<count;i++){
    parts.push({
      x:x*dpr + (Math.random()-.5)*46*dpr,
      y:y*dpr + (Math.random()-.5)*22*dpr,
      vx:(Math.random()-.5)*1.9*dpr,            // 往两边飘得更开
      vy:(Math.random()*0.7-0.28)*dpr,          // 轻，有的还会先往上飘一点
      life:1,
      // 与背景萤火虫同规格：柔光贴图 + 白色亮核 + 呼吸
      size:(Math.random()*6+3)*dpr, core:(Math.random()*1.1+0.5)*dpr,
      phase:Math.random()*6.28, bspeed:Math.random()*0.8+0.28,
      glow:GLOWS[(Math.random()<0.82?(Math.random()*3|0):3)], t:Math.random()*100
    });
  }
  if(parts.length>1000) parts.splice(0,parts.length-1000);
}
/* 烟花：摇动指针/快速滑动触发 */
function burst(x,y){
  const dpr=devicePixelRatio;
  parts.push({k:'sp',x:x*dpr,y:y*dpr,vx:0,vy:0,life:.6,
    size:36*dpr,core:0,phase:0,bspeed:9,glow:GLOWS[0],t:0,dec:.05});   // 中心闪光
  for(let i=0;i<52;i++){
    const a=Math.random()*6.283, sp=(Math.random()*6.4+1.8)*dpr;
    parts.push({
      k:'fw',
      x:x*dpr+(Math.random()-.5)*6*dpr, y:y*dpr+(Math.random()-.5)*6*dpr,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.0*dpr,
      life:1, size:(Math.random()*6.5+3)*dpr, core:(Math.random()*1.1+.5)*dpr,
      phase:Math.random()*6.28, bspeed:Math.random()*3+2,
      glow:GLOWS[(Math.random()<0.82?(Math.random()*3|0):3)], t:Math.random()*100
    });
  }
  if(parts.length>1000) parts.splice(0,parts.length-1000);
}
/* 摇动判定：位移段方向法 —— 每累计一段位移结算一次方向，
   相邻段方向掉头(夹角>110°)且速度够快即记一次反转，1秒内3次触发 */
const shake={px:0,py:0,lastT:0,dx:0,dy:0,segT:0,dirX:0,dirY:0,rev:0,win:0,cool:0};
function shakeFeed(x,y){
  const t=performance.now();
  if(!shake.lastT){shake.lastT=t;shake.px=x;shake.py=y;return;}
  const dt=t-shake.lastT;
  if(dt>160){ shake.dx=0;shake.dy=0;shake.segT=0;shake.dirX=0;shake.dirY=0;
              shake.lastT=t;shake.px=x;shake.py=y;return; }
  shake.dx+=x-shake.px; shake.dy+=y-shake.py; shake.segT+=dt;
  shake.px=x;shake.py=y;shake.lastT=t;
  const len=Math.hypot(shake.dx,shake.dy);
  if(len>26){
    const ux=shake.dx/len, uy=shake.dy/len;
    const fast=len/Math.max(1,shake.segT)>0.45;      // px/ms
    if((shake.dirX||shake.dirY)&&fast&&(ux*shake.dirX+uy*shake.dirY)<-0.35){
      if(t-shake.win>1000){shake.rev=0;shake.win=t;}
      shake.rev++;
      if(shake.rev>=3){shake.rev=0;burst(x,y);}
    }
    shake.dirX=ux;shake.dirY=uy;shake.dx=0;shake.dy=0;shake.segT=0;
  }
}
function drawFall(){
  fx.clearRect(0,0,fc.width,fc.height);
  fx.globalCompositeOperation='lighter';
  const dprD=devicePixelRatio;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(p.k==='fw'){
      p.vx*=.962; p.vy*=.962; p.vy+=.030*dprD;              // 炸开减速→缓慢降落
      p.x+=p.vx; p.y+=p.vy; p.life-=.0058; p.t+=0.016;
      if(p.life>.2&&Math.random()<.13){                     // 亮晶晶拖尾
        parts.push({k:'sp',x:p.x,y:p.y,vx:(Math.random()-.5)*.3*dprD,vy:.1*dprD,
          life:.55,size:(Math.random()*1.8+1)*dprD,core:.5*dprD,
          phase:Math.random()*6.28,bspeed:8,glow:p.glow,t:0,dec:.028});
      }
    }else if(p.k==='sp'){
      p.x+=p.vx; p.y+=p.vy; p.vy+=.003*dprD; p.life-=(p.dec||.028); p.t+=0.016;
    }else{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.006*dprD; p.vx*=0.992; p.life-=0.007; p.t+=0.016;
    }
    if(p.life<=0){parts.splice(i,1);continue;}
    const breath=(p.k==='sp')
      ? (.45+.55*Math.sin(p.t*p.bspeed*6+p.phase))          // 快速闪烁
      : (0.55+0.45*Math.sin(p.t*p.bspeed+p.phase));         // 萤火虫式呼吸
    const a=Math.max(0,Math.min(1,p.life*breath));
    const sz=p.size*(0.7+0.3*a);
    fx.globalAlpha=a; fx.drawImage(p.glow, p.x-sz, p.y-sz, sz*2, sz*2);
    fx.globalAlpha=Math.min(1,a*1.25); fx.fillStyle='#fff';
    fx.beginPath(); fx.arc(p.x,p.y,p.core*(0.6+a*0.6),0,7); fx.fill();
  }
  fx.globalAlpha=1; fx.globalCompositeOperation='source-over';
  requestAnimationFrame(drawFall);
}

/* ---------------- 播放器 ---------------- */
const audio=document.getElementById('audio');
const $=id=>document.getElementById(id);
let curCat=null, curIdx=-1, isPlaying=false;

function openCat(cat){
  curCat=cat; const lib=LIBRARY[cat];
  $('pcat').textContent=lib.name;
  renderList();
  show('player');
}
function renderList(){
  const lib=LIBRARY[curCat], el=$('list'); el.innerHTML='';
  lib.tracks.forEach((t,i)=>{
    const row=document.createElement('div');
    row.className='row'+(i===curIdx?' cur':'')+(i===curIdx&&isPlaying?' play-anim':'');
    row.innerHTML=`<span class="idx">${i+1}</span><span class="rt">${t.title}</span>
      <span class="bars"><i></i><i></i><i></i></span>`;
    row.addEventListener('click',()=>load(i,true));
    el.appendChild(row);
  });
}
function load(i,autoplay){
  const lib=LIBRARY[curCat]; if(i<0||i>=lib.tracks.length)return;
  curIdx=i; const t=lib.tracks[i];
  audio.src=t.src; $('ttitle').textContent=t.title;
  $('thint').textContent='';
  renderList();
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:lib.name,album:'晚安'});
  }
  if(autoplay){ audio.play().catch(()=>{}); }
}
$('play').addEventListener('click',()=>{
  if(curIdx<0){ load(0,true); return; }
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
});
$('prev').addEventListener('click',()=>load(curIdx<=0?LIBRARY[curCat].tracks.length-1:curIdx-1,true));
$('next').addEventListener('click',()=>nextTrack());
function nextTrack(){
  const n=LIBRARY[curCat].tracks.length;
  load((curIdx+1)%n,true);
}
audio.addEventListener('play',()=>{isPlaying=true;setPlayIcon(true);renderList();document.getElementById('player').classList.add('playing');});
audio.addEventListener('pause',()=>{isPlaying=false;setPlayIcon(false);renderList();const pl=document.getElementById('player');pl.classList.remove('playing');pl.querySelector('.timer').classList.remove('reveal');});
audio.addEventListener('ended',()=>{
  if(timerMode===-1){ stopFade(); return; }      // 本段结束
  nextTrack();
});
function setPlayIcon(playing){
  $('playPath').setAttribute('d', playing ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z');
}
function fmt(s){ if(isNaN(s))return'0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
audio.addEventListener('timeupdate',()=>{
  if(!seeking){ $('seek').value = audio.duration ? (audio.currentTime/audio.duration*1000) : 0; }
  $('cur').textContent=fmt(audio.currentTime); $('dur').textContent=fmt(audio.duration);
});
let seeking=false;
$('seek').addEventListener('input',()=>{seeking=true;});

/* ---------------- 睡眠定时 ---------------- */
let timerMode=0, timerId=null, timerEnd=0, statusId=null;
document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
    ch.classList.add('on');
    setTimer(parseInt(ch.dataset.min));
  });
});
function setTimer(min){
  timerMode=min;
  clearTimeout(timerId); clearInterval(statusId); timerId=null; statusId=null;
  audio.volume=1;
  if(min===0){ $('tstatus').textContent=''; return; }
  if(min===-1){ $('tstatus').textContent='这一段听完后会停下'; return; }
  timerEnd=Date.now()+min*60000;
  timerId=setTimeout(stopFade, min*60000);
  statusId=setInterval(()=>{
    const left=Math.max(0,timerEnd-Date.now());
    $('tstatus').textContent=fmt(left/1000)+' 后自动停止';
  },1000);
  $('tstatus').textContent=fmt(min*60)+' 后自动停止';
}
function stopFade(){
  clearInterval(statusId);
  $('tstatus').textContent='正在轻轻停下…';
  let v=audio.volume;
  const fade=setInterval(()=>{
    v-=0.05; if(v<=0){ v=0; clearInterval(fade); audio.pause(); audio.volume=1;
      $('tstatus').textContent='已停止，晚安';
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      document.querySelector('.chip[data-min="0"]').classList.add('on'); timerMode=0;
    }
    audio.volume=Math.max(0,v);
  },160);
}

/* 播放态：点「睡眠定时」四个字 → 选项渐入替换，约两秒后渐出还原 */
(function(){
  const pl=document.getElementById('player');
  const tm=pl.querySelector('.timer'), lab=tm.querySelector('.lab');
  function hideLater(ms){ clearTimeout(tm._rt); tm._rt=setTimeout(()=>tm.classList.remove('reveal'),ms); }
  lab.addEventListener('click',()=>{
    if(!pl.classList.contains('playing'))return;
    tm.classList.add('reveal'); hideLater(3400);
  });
  tm.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    if(pl.classList.contains('playing')) hideLater(1900);
  }));
})();

  navigator.mediaSession.setActionHandler('nexttrack',()=>nextTrack());
}

  ' float dy=iconSD(c+vec2(0.,ep),P)-iconSD(c-vec2(0.,ep),P);\n'+
  ' return normalize(vec2(dx,dy)+vec2(1e-5));}\n'+
  'vec3 lensIcon(vec3 col,vec2 coord,vec4 P){\n'+
  ' vec2 c=coord-P.xy;\n'+
  ' float s=P.z*(1.+((P.w<1.5)?uMorph*1.2:0.));\n'+
  ' float uf=(P.w<1.5)?uMorph:0.;\n'+
  ' return glassHQ(col,coord,c,iconSD(c,P),iconGrad(c,P),s,s*s*3.,P.w*2.3,uf);}\n'+
  'float moonSD(vec2 c){\n'+
  ' float sd1=length(c)-uM0.z;\n'+
  ' float sd2=length(c-uM1.xy)-uM1.z;\n'+
  ' return max(sd1,-sd2);}\n'+
  'vec2 moonGrad(vec2 c){float ep=1.5;\n'+
  ' float dx=moonSD(c+vec2(ep,0.))-moonSD(c-vec2(ep,0.));\n'+
  ' float dy=moonSD(c+vec2(0.,ep))-moonSD(c-vec2(0.,ep));\n'+
  ' return normalize(vec2(dx,dy)+vec2(1e-5));}\n'+
  'float sdUC(vec2 p,float r1,float r2,float h){\n'+
  ' p.x=abs(p.x);float b=(r1-r2)/h;float a=sqrt(max(1e-4,1.-b*b));\n'+
  ' float k=dot(p,vec2(-b,a));\n'+
  ' if(k<0.)return length(p)-r1;\n'+
  ' if(k>a*h)return length(p-vec2(0.,h))-r2;\n'+
  ' return dot(p,vec2(a,b))-r1;}\n'+
  'float dropSD(vec2 c,vec4 D){vec2 lp=c-D.xy;\n'+
  ' float cs=cos(.30),sn=sin(.30);\n'+
  ' lp=vec2(cs*lp.x-sn*lp.y,sn*lp.x+cs*lp.y);\n'+
  ' return sdUC(lp,D.z,D.z*.10,D.w);}\n'+
  'vec2 dropGrad(vec2 c,vec4 D){float ep=1.5;\n'+
  ' float dx=dropSD(c+vec2(ep,0.),D)-dropSD(c-vec2(ep,0.),D);\n'+
  ' float dy=dropSD(c+vec2(0.,ep),D)-dropSD(c-vec2(0.,ep),D);\n'+
  ' return normalize(vec2(dx,dy)+vec2(1e-5));}\n'+
  'vec3 lensDrop(vec3 col,vec2 coord,vec4 D){\n'+
  ' vec2 c=coord-D.xy;\n'+
  ' return glassHQ(col,coord,c,dropSD(coord,D),dropGrad(coord,D),D.z,D.z*D.z*3.,D.z*.13+1.1,1.);}\n'+
  'vec3 lensMoon(vec3 col,vec2 coord){\n'+
  ' vec2 c=coord-uM0.xy;\n'+
  ' return glassHQ(col,coord,c,moonSD(c),moonGrad(c),uM0.z*.36,uM0.z*uM0.z*.55,3.3,1.);}\n'+
  'void main(){\n'+
  ' vec2 coord=gl_FragCoord.xy;\n'+
  ' vec3 col=cloud(coord);\n'+
  ' if(uGw>.003){ col=mix(col,lensMoon(col,coord),uGw);\n'+
  '  col=mix(col,lensDrop(col,coord,uD1),uGw);\n'+
  '  col=mix(col,lensDrop(col,coord,uD2),uGw); }\n'+
  ' if(uGlass>.003){\n'+
  '  col=mix(col,lensHQ(col,coord,uL1,0.),uGlass);\n'+
  '  col=mix(col,lensHQ(col,coord,uL2,2.7),uGlass);\n'+
  ' }\n'+
  ' if(uGp>.003){\n'+
  '  col=mix(col,lensIcon(col,coord,uPb),uGp);\n'+
  '  col=mix(col,lensIcon(col,coord,uPc),uGp);\n'+
  '  col=mix(col,lensIcon(col,coord,uPa),uGp);\n'+
  ' }\n'+
  ' gl_FragColor=vec4(col,1.);}';

  function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){return null;}return s;}
  const vs=sh(gl.VERTEX_SHADER,VS),fs=sh(gl.FRAGMENT_SHADER,FS);
  if(!vs||!fs){cv.remove();return;}
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();return;}
  gl.useProgram(pr);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(pr,'uRes'),uT=gl.getUniformLocation(pr,'uT');
  const uL1=gl.getUniformLocation(pr,'uL1'),uL2=gl.getUniformLocation(pr,'uL2'),
        uGlass=gl.getUniformLocation(pr,'uGlass'),
        uM0=gl.getUniformLocation(pr,'uM0'),uM1=gl.getUniformLocation(pr,'uM1'),uGw=gl.getUniformLocation(pr,'uGw'),
        uD1=gl.getUniformLocation(pr,'uD1'),uD2=gl.getUniformLocation(pr,'uD2'),
        uPa=gl.getUniformLocation(pr,'uPa'),uPb=gl.getUniformLocation(pr,'uPb'),
        uPc=gl.getUniformLocation(pr,'uPc'),uGp=gl.getUniformLocation(pr,'uGp'),
        uMorph=gl.getUniformLocation(pr,'uMorph');

  function sizeFlow(){
    const sc=Math.min(devicePixelRatio,2)*0.70;
    cv.width=Math.max(2,innerWidth*sc|0); cv.height=Math.max(2,innerHeight*sc|0);
    gl.viewport(0,0,cv.width,cv.height);
  }
  sizeFlow(); addEventListener('resize',sizeFlow);
  document.querySelector('.fluid').style.display='none';
  document.body.classList.add('gl');

  const homeEl=document.getElementById('home'), welEl=document.getElementById('welcome'),
        playerScr=document.getElementById('player'),
        prevB=document.getElementById('prev'), playB=document.getElementById('play'),
        nextB=document.getElementById('next');
  const gw1=document.getElementById('gw1'), gw2=document.getElementById('gw2'),
        gw0=document.getElementById('gw0'),
        dch1=document.getElementById('dch1'), dch2=document.getElementById('dch2');
  let glassT=0, glassW=0, glassP=0, morphT=0;
  function lensUniform(u,el,scale,padX,padY){
    const r=el.getBoundingClientRect();
    const cx=(r.left+r.right)/2*scale;
    const cy=cv.height-(r.top+r.bottom)/2*scale;      // y 翻转
    const hx=(r.width/2+padX)*scale, hy=(r.height/2+padY)*scale;
    gl.uniform4f(u,cx,cy,hx,hy);
  }
  const t0=performance.now(); let last=0;
  function loop(now){
    requestAnimationFrame(loop);
    if(now-last<33) return;                          // ~30fps
    last=now;
    glassT+=((homeEl.classList.contains('active')?1:0)-glassT)*.13;
    if(glassT<.003)glassT=0;
    glassW+=((welEl.classList.contains('active')?1:0)-glassW)*.13;
    if(glassW<.003)glassW=0;
    const scale=cv.width/innerWidth;
    if(glassT>0){ lensUniform(uL1,gw1,scale,20,16); lensUniform(uL2,gw2,scale,30,26); }
    if(glassW>0){
      const r0=gw0.getBoundingClientRect();
      const txc=(r0.left+r0.right)/2, tyc=(r0.top+r0.bottom)/2;   // CSS px
      const Rc=(r0.height/2)+40;
      const bxc=txc+Rc*.68;
      gl.uniform4f(uM0,bxc*scale,cv.height-(tyc-9)*scale,Rc*scale,0);
      gl.uniform4f(uM1,Rc*.52*scale,Rc*.20*scale,Rc*.94*scale,0);
      // 两滴水滴：跟着月亮 + 各自轻浮
      const t=now/1000;
      const d1x=bxc+Rc*.42, d1y=tyc-Rc*.52+Math.sin(t*.45)*5;
      const d2x=bxc+Rc*1.10, d2y=tyc-Rc*.82+Math.sin(t*.62+2.1)*4;
      const r1=Rc*.27, r2=Rc*.16;
      gl.uniform4f(uD1,d1x*scale,cv.height-d1y*scale,r1*scale,Rc*.55*scale);
      gl.uniform4f(uD2,d2x*scale,cv.height-d2y*scale,r2*scale,Rc*.38*scale);
      dch1.style.left=d1x+'px'; dch1.style.top=d1y+'px';
      dch2.style.left=d2x+'px'; dch2.style.top=d2y+'px';
    }
    glassP+=((playerScr.classList.contains('active')?1:0)-glassP)*.13;
    if(glassP<.003)glassP=0;
    morphT+=((playerScr.classList.contains('playing')?1:0)-morphT)*.07;
    if(morphT<.001)morphT=0;
    if(glassP>0){
      const si=(u,el,f,kind)=>{const r=el.getBoundingClientRect();
        gl.uniform4f(u,(r.left+r.right)/2*scale,cv.height-(r.top+r.bottom)/2*scale,
                     r.height*f*scale,kind);};
      si(uPa,playB,.30,1); si(uPb,prevB,.36,2); si(uPc,nextB,.36,3);
    }
    gl.uniform1f(uGp,glassP); gl.uniform1f(uMorph,morphT);
    gl.uniform1f(uGlass,glassT); gl.uniform1f(uGw,glassW);
    gl.uniform2f(uRes,cv.width,cv.height);
    gl.uniform1f(uT,(now-t0)/1000);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  requestAnimationFrame(loop);
})();

/* ---------------- film grain（1% 细颗粒） ---------------- */
(function(){
  const g=document.createElement('canvas');g.width=g.height=128;
  const c=g.getContext('2d');const im=c.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){
    const v=(Math.random()*255)|0;
    im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;
  }
  c.putImageData(im,0,0);
  const d=document.getElementById('grain');
  d.style.backgroundImage='url('+g.toDataURL()+')';
  let k=0;
  setInterval(()=>{k=(k+1)&7; d.style.backgroundPosition=(k*37)+'px '+((k*61)&127)+'px';},90);
})();

/* service worker（离线可用） */
if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
